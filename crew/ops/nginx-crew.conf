# Crew v3 (Paperclip) on the shared edge nginx, HTTPS. Source: /opt/crew-v3-spike/ops/nginx-crew.conf,
# copied into the 2ps-landing-nginx container as /etc/nginx/conf.d/crew.conf. The certificate comes from the
# shared certbot container (volume 2ps-landing_certbot-conf mounted at /etc/letsencrypt).
map $http_upgrade $crew_connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name crew.2p-solutions.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name crew.2p-solutions.com;

  ssl_certificate /etc/letsencrypt/live/crew.2p-solutions.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crew.2p-solutions.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:crew_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Paperclip listens only on the host's Tailscale address; the container reaches it through the host.
  set $crew_upstream http://100.105.105.12:3100;

  # Plugin webhooks carry docs snapshots up to 5 MB; portable JSON imports can be larger.
  client_max_body_size 20m;

  # Stock Paperclip UI (no Crew overlay) for side-by-side comparison, served as static files under /paperclip/.
  # Same origin as the Crew UI, so the login cookie is shared and /api plus the live-events WebSocket keep going
  # through "location /" to the one prod server. Files: /usr/share/nginx/crew-stock-ui/paperclip (crew/ops/stock-ui.sh).
  location = /paperclip {
    return 301 /paperclip/;
  }

  location ^~ /paperclip/ {
    root /usr/share/nginx/crew-stock-ui;
    try_files $uri /paperclip/index.html;

    location ^~ /paperclip/assets/ {
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  location = /paperclip/index.html {
    root /usr/share/nginx/crew-stock-ui;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass $crew_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $crew_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Live updates and plugin streams are SSE/WebSocket: no buffering, long reads.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
