<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPS-750 · Trạng thái nhãn máy</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./mockup.css">
<script src="./ui.js"></script>
</head>
<body>
<!-- Màn 4: bảng chú giải bốn trạng thái máy ở từng chỗ hiện, cộng trạng thái đang tải / lỗi tải máy,
     tên máy dài bị cắt, thẻ board chế độ gọn, và theme tối. -->
<div id="app"></div>
<script>
  const ctxRow = (key, name, note) => `<tr>
    <td><b>${name}</b></td>
    <td>${machineLabel(key, { unpinned: 'text' })}</td>
    <td>${key ? machineLabel(key, { withState: true }) : '<span class="muted">(không hiện)</span>'}</td>
    <td class="n">${note}</td></tr>`;
  const legend = `<table class="legend">
    <thead><tr><th>Trạng thái</th><th>Cột Máy (desktop, có tooltip)</th><th>Thẻ board · màn hẹp · bộ lọc</th><th>Ý nghĩa và tooltip</th></tr></thead>
    <tbody>
      ${ctxRow('mini', 'Online', 'Chấm xanh. Tooltip: “demo-mac-01.local · Đang kết nối.”')}
      ${ctxRow('mbp', 'Offline', 'Icon wifi gạch, xám. Tooltip: tên đầy đủ và “Mất liên lạc. Yêu cầu trong cây chờ máy này trở lại.” Không có mốc giờ: server không trả thời điểm mất liên lạc.')}
      ${ctxRow('imac', 'Đã gỡ ghép', 'Icon mắt xích đứt, hổ phách, chữ “Đã gỡ ghép” thay tên. Server không trả tên hay thời điểm cho máy đã gỡ ghép, nên không có tên gạch ngang hay mốc giờ. Tooltip: “Máy đã gỡ ghép… cho tới khi ghim máy khác.”')}
      ${ctxRow(null, 'Chưa ghim', 'Chỉ cột danh sách desktop hiện chữ “Chưa ghim” để giữ thẳng cột và giải thích ô trống. Thẻ board, màn hẹp: không hiện gì.')}
    </tbody></table>`;
  const loading = rows([ISSUES[2]], { machineCell: () => '<span class="skel" aria-label="Đang tải máy"></span>' });
  const error = `<p class="err" role="alert">Không tải được máy của các yêu cầu. <a href="#">Thử lại</a></p>` +
    rows([ISSUES[2]], { machineCell: () => '<span class="muted" title="Không tải được máy">—</span>' });
  const longM = (MACHINES.long = { host: 'demo-mac-04-ten-may-rat-dai-de-thu-cat-chu', full: 'demo-mac-04-ten-may-rat-dai-de-thu-cat-chu.local', state: 'online' });
  const longRow = rows([{ ...ISSUES[4], m: 'long', id: 'TPS-742', title: 'Tên máy dài bị cắt bằng dấu …, đủ tên trong tooltip' }]);
  const board = (cls) => `<div class="board ${cls}">${['mini', 'mbp', 'imac', null].map((m, i) => `<div style="width:260px;flex-shrink:0">${card({ ...flat()[i + 1], m })}</div>`).join('')}</div>`;
  const body = `<h1 class="title">Trạng thái nhãn máy</h1>
    <div class="frame-title">1 · Bốn trạng thái ở từng chỗ hiện</div><div class="panel">${legend}</div>
    <div class="frame-title">2 · Đang tải máy (danh sách đã có, máy chưa về)</div><div class="panel">${colHead()}${loading}</div>
    <div class="frame-title">3 · Lỗi tải máy</div><div class="panel">${colHead()}${error}</div>
    <div class="frame-title">4 · Tên máy dài</div><div class="panel">${colHead()}${longRow}</div>
    <div class="frame-title">5 · Thẻ board chế độ gọn (bốn trạng thái)</div>${board('compact')}
    <div class="frame-title">6 · Theme tối</div>
    <div class="dark panel" style="background:var(--background);color:var(--foreground)">${colHead()}${rows([ISSUES[1], ISSUES[2], ISSUES[3]])}${board('')}</div>`;
  document.getElementById('app').innerHTML = frame(body);
</script>
</body>
</html>
