    - "packages/adapters/opencode-local/src/server/index.ts"
    - "ui/src/components/ImageGalleryModal.tsx"
    - "ui/src/components/IssueAttachmentsSection.tsx"
    - "ui/src/components/MarkdownBody.tsx"
    - "ui/src/components/StoredImage.tsx"
    - "ui/src/components/TaskChatThread.tsx"
