# Manifest flow ↔ file của phần Crew trong bản fork Paperclip (nguồn sự thật). Chuẩn: STANDARD.md của crew-docs
# (repo crew, packages/docs-kit/STANDARD.md). Chỉ code Crew là nguồn; code upstream Paperclip không thuộc phạm vi,
# trừ các file upstream Crew vá (crew/release/core-hooks.json và vá UI gốc), liệt kê đích danh dưới source.include.
# Các mục source, shared, unassigned được bảo vệ (luật R6): chỉ đổi khi chủ dự án cho phép.
version: 1
source:
  include:
    - "server/src/crew/**"
    - "packages/crew-plugin/src/**"
